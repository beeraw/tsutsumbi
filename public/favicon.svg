<!--
  Tsutsumbi: a small Mayotte insect. Insect, bug, project tracker.

  The carapace highlight and the five spots the first draft carried are gone.
  They were painted in currentColor at partial opacity on top of a solid fill of
  that same colour, which gives the colour back unchanged — they could never
  show. The silhouette is what reads, and it still reads at 16 pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 3 100 100" width="256" height="256" role="img" aria-label="Tsutsumbi">
  <style>
    svg { color: #DE8A2A; }
  </style>
  <g fill="currentColor">
    <path d="M64 41 C74 37, 85 29, 92.5 16.5 L95.5 19.5 C88 33, 78 47, 69 56 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="62" cy="49" r="12"/>
    <ellipse cx="42" cy="59" rx="27" ry="14" transform="rotate(-10 42 59)"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 63 L64 80 L72 84"/>
    <path d="M46 70 L44 86 L36 89"/>
    <path d="M31 68 L23 82 L14 84"/>
  </g>
</svg>
