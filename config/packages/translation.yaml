framework:
    # The language of the interface is a deployment choice, not a per-user one:
    # a tsutsumbi instance is read by one small team, and a switcher in the
    # chrome would be a control nobody touches twice. Set APP_LOCALE in
    # .env.local and the whole interface follows, dates and numbers included.
    #
    # Nothing negotiates on Accept-Language either: an agent posting through the
    # API would then get its errors in whatever language its HTTP client happens
    # to announce, which is nobody's intent.
    default_locale: '%env(string:APP_LOCALE)%'

    # The catalogues that get compiled and warmed up. APP_LOCALE is read at
    # runtime, so this list does not validate it: a value outside the list is
    # not an error, it simply finds no catalogue and every string comes back in
    # the English of the fallback below. That is the failure worth having —
    # readable, rather than a screen of raw translation keys.
    enabled_locales: ['en', 'fr', 'es', 'de', 'pt', 'it']

    translator:
        default_path: '%kernel.project_dir%/translations'
        # English is the reference catalogue: it is the one kept complete, and
        # the one a key missing from any other language falls back to.
        fallbacks:
            - en
