            label: "Chave"
            help: "Dez caracteres no máximo, letras e algarismos. Os tickets tiram dele o seu identificador: passar de TSUTSUMBI para TSU renomeia TSUTSUMBI-42 para TSU-42, e a referência antiga, escrita num commit ou numa mensagem, deixa de levar a lado nenhum."

